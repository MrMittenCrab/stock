[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "stock-terminal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["textual>=6.12,<7"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "numpy>=1.26,<3"]
semantic = ["fastembed==0.9.0", "numpy>=1.26,<3", "onnxruntime>=1.24.2,<2", "tokenizers==0.22.2", "huggingface-hub>=0.36,<1"]
[project.scripts]
stock = "stock.cli:main"
[tool.setuptools.packages.find]
include = ["stock*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--basetemp=.data/test-tmp"
